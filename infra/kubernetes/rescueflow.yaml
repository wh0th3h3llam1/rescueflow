apiVersion: v1
kind: Namespace
metadata:
  name: rescueflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rescueflow-config
  namespace: rescueflow
data:
  HTTP_ADDR: ":8080"
  KAFKA_BROKERS: "kafka:9092"
  REDIS_ADDR: "redis:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: rescueflow-secrets
  namespace: rescueflow
type: Opaque
stringData:
  POSTGRES_DSN: "REPLACE_BEFORE_DEPLOYMENT"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rescueflow-api
  namespace: rescueflow
spec:
  replicas: 1
  selector:
    matchLabels: {app: rescueflow-api}
  template:
    metadata:
      labels: {app: rescueflow-api}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/replace-me/rescueflow:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: rescueflow-config}
            - secretRef: {name: rescueflow-secrets}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata:
  name: rescueflow-api
  namespace: rescueflow
spec:
  selector: {app: rescueflow-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rescueflow-web
  namespace: rescueflow
spec:
  replicas: 2
  selector:
    matchLabels: {app: rescueflow-web}
  template:
    metadata:
      labels: {app: rescueflow-web}
    spec:
      containers:
        - name: web
          image: ghcr.io/replace-me/rescueflow-web:latest
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata:
  name: rescueflow-web
  namespace: rescueflow
spec:
  selector: {app: rescueflow-web}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rescueflow-web
  namespace: rescueflow
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: rescueflow-web}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}

