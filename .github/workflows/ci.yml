name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.27.1', cache: true}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.12', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  contracts-and-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli lint docs/api/openapi.yaml
      - run: npx --yes @asyncapi/cli validate docs/events/asyncapi.yaml
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize infra/kubernetes >/dev/null
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: rescueflow:test}
      - uses: docker/build-push-action@v6
        with: {context: web, push: false, tags: rescueflow-web:test}
      - uses: aquasecurity/trivy-action@0.31.0
        with: {image-ref: rescueflow:test, severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true}

